{% extends "base.html" %}
{% block content %}
<h2>Students</h2>
<form method="post" class="inline-form">
  <input name="reg_no" placeholder="Register No." required>
  <input name="name" placeholder="Full name" required>
  <input name="department" placeholder="Department" required>
  <input name="email" type="email" placeholder="Email" required>
  <button>Add student</button>
</form>
<table>
  <tr><th>Reg. No.</th><th>Name</th><th>Department</th><th>Email</th><th></th></tr>
  {% for s in students %}
  <tr>
    <td>{{ s.reg_no }}</td><td>{{ s.name }}</td><td>{{ s.department }}</td><td>{{ s.email }}</td>
    <td><form method="post" action="{{ url_for('campus.delete_student', student_id=s.id) }}"
              onsubmit="return confirm('Remove this student and their attendance?')">
        <button class="danger">Delete</button></form></td>
  </tr>
  {% else %}<tr><td colspan="5">No students yet.</td></tr>
  {% endfor %}
</table>
{% endblock %}
