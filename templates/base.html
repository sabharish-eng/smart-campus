<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Smart Campus{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>Smart Campus Management</h1>
    <nav>
      <a href="{{ url_for('campus.index') }}">Dashboard</a>
      <a href="{{ url_for('campus.students') }}">Students</a>
      <a href="{{ url_for('campus.attendance') }}">Attendance</a>
      <a href="{{ url_for('campus.rooms') }}">Rooms</a>
      <a href="{{ url_for('campus.notices') }}">Notices</a>
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
